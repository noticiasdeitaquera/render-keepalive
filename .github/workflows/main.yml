name: Keep Render awake

on:
  schedule:
    # Executa a cada 5 minutos (pode atrasar alguns minutos)
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    name: Ping Render feed
    runs-on: ubuntu-latest
    timeout-minutes: 3
    concurrency:
      group: ping-render
      cancel-in-progress: true
    steps:
      - name: Curl ping with retries and jitter
        shell: bash
        env:
          PING_URL: ${{ secrets.PING_URL }}
        run: |
          if [ -z "$PING_URL" ]; then
            echo "PING_URL secret not set"; exit 1
          fi

          # Pequeno jitter aleatório para distribuir carga
          SLEEP=$(( RANDOM % 20 ))
          echo "Sleeping $SLEEP seconds before ping..."
          sleep $SLEEP

          # Ping com retries, timeout e cabeçalhos
          for i in 1 2 3; do
            echo "Attempt $i: requesting $PING_URL"
            HTTP_CODE=$(curl -sS -o /dev/null -w "%{http_code}" \
              --max-time 20 \
              --retry 2 \
              --retry-delay 3 \
              --retry-connrefused \
              -H "User-Agent: Mozilla/5.0 (RSS KeepAlive via GitHub Actions)" \
              "$PING_URL" || echo "000")

            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "304" ]; then
              echo "Success ($HTTP_CODE)"; exit 0
            fi

            echo "Received HTTP $HTTP_CODE; retrying..."
            sleep 4
          done

          echo "Failed to keep alive. Last HTTP $HTTP_CODE"
          # Não falha o job para evitar alertas; comente a linha abaixo para falhar
          # exit 1
